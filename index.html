<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Biblioteca A-Frame: criação da cena 3D-->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!--Biblioteca MindAR: reconhecimento e rastreamento da imagem-->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <title>Aula de Realidade Aumentada</title>
</head>

<body>
    <h1>Minha aplicação WebAR</h1>


    <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false"
    >

    <!--Câmera do dispositivo-->
    <a-camera
        position="0 0 0"
        look-controls="enabled: false"
    >
    </a-camera>

    <!--Objeto associado a imagem que será reconhecida-->
    <a-entity mindar-image-target="targetIndex: 0">

        <!--Cubo virtual-->
        <a-box
            position="0 0 0.25"
            rotation="0 0 0"
            scale="0.5 0.5 0.5"
        >
        </a-box>
    </a-entity>
    </a-scene>

    <p>Aplicação publicada utilizando GitHub Pages</p>
</body>
</html>
